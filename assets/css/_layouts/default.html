<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
<!--[if lt IE 9]>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
<![endif]-->
</head>
<body>
<!-- 右上角汉堡菜单 -->
<div style="position:absolute;top:20px;right:20px;z-index:9999;">
<button id="menuBtn" style="border:none;background:#000;color:#fff;font-size:24px;padding:4px 10px;border-radius:4px;">☰</button>
<div id="menuBox" style="display:none;position:absolute;right:0;top:40px;background:white;box-shadow:0 2px 10px #888;padding:10px;min-width:120px;">
<div style="padding:4px 0"><a href=" ">首页</a ></div>
<div style="padding:4px 0"><a href="/about">关于我</a ></div>
</div>
</div>
<script>
const btn=document.getElementById("menuBtn");
const box=document.getElementById("menuBox");
btn.onclick=()=>{
  if(box.style.display === 'block'){
    box.style.display = 'none';
  }else{
    box.style.display = 'block';
  }
}
</script>

<div class="wrapper">
<header class="page-header">
<h1 class="project-name">{{ page.title | default: site.title }}</h1>
<h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
</header>

<section class="main-content">
{{ content }}
</section>

<footer class="site-footer">
{% if site.github.is_project_page %}
<span class="site-footer-owner"><a href="{{ site.github.repository_url }}">{{ site.github.repository_name }}</a >.</span>
{% endif %}
<span class="site-footer-credits">This page was generated by <a href="https://pages.github.com">GitHub Pages</a >.</span>
</footer>
</div>
</body>
</html>
