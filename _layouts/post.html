---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>

  <div style="color:#666; margin-bottom:2rem; font-size:16px;">
    📅 发布时间：{{ page.date | date: "%Y-%m-%d" }}
    <br>
    📂 分类: {% if page.categories %}{{ page.categories | join: ", " }}{% else %}{{ page.category }}{% endif %}
    <br>
    🏷️ 标签：{{ page.tags | join: ", " }}
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</article>
